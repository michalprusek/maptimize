[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maptalk-mcp"
version = "0.1.0"
description = "MCP server exposing maptalk (maptimize) document search, document reading and web search to Claude Code and Claude Desktop."
requires-python = ">=3.10"
dependencies = [
    # Upper bound is load-bearing. A bare `>=1.2` resolved to mcp 2.0 on the next
    # image rebuild and the server stopped starting: 2.0 renamed ToolAnnotations'
    # fields to snake_case AND dropped the `Server.list_tools()` decorator this
    # server is built on. The tests could not catch it — they run against the
    # local venv, which was still on 1.x. Moving to 2.x is a real port, not a
    # version bump.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "starlette>=0.37",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
maptalk-mcp = "maptalk_mcp.__main__:main"

[tool.setuptools]
packages = ["maptalk_mcp"]

[tool.setuptools.package-data]
maptalk_mcp = ["tools.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
